:root {
  --nuit: #161449;
  --nuit-2: #24226a;
  --turquoise: #61E3E3;
  --blanc: #FFFFFF;
  --gris: #595959;
  --gris-clair: #E7E6E6;
  --fond: #F6F6F9;
  --voile: rgba(22, 20, 73, .06);
  --rayon: 3px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Montserrat", Calibri, "Segoe UI", sans-serif;
  font-size: 13px; line-height: 1.5; color: var(--nuit); background: var(--blanc);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--turquoise); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- Volet ---------- */
.pane { display: flex; flex-direction: column; min-height: 100%; background: var(--blanc); position: relative; }
.brand {
  position: relative; background: var(--nuit); color: var(--blanc);
  padding: 18px 20px 18px; overflow: hidden; flex: none;
}
.brand::after { /* triangle turquoise de la charte */
  content: ""; position: absolute; right: 0; bottom: 0; width: 54px; height: 54px;
  background: var(--turquoise); clip-path: polygon(100% 0, 100% 100%, 0 100%);
}
.brand img { display: block; height: 20px; width: auto; }
.brand .dash { width: 30px; height: 4px; background: var(--turquoise); margin: 12px 0 12px; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }

.status {
  display: flex; align-items: center; gap: 9px; padding: 11px 20px; flex: none;
  border-bottom: 1px solid var(--gris-clair); font-size: 10.5px; font-weight: 700;
  letter-spacing: .09em; text-transform: uppercase;
}
.status .dot { width: 8px; height: 8px; background: var(--turquoise); flex: none; }
.status #statusText { white-space: nowrap; flex: none; }
.status .chip {
  margin-left: auto; font-weight: 600; letter-spacing: .02em; text-transform: none; color: var(--gris);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; text-align: right;
}
.body { padding: 18px 20px 8px; flex: 1; }
.lead { margin: 0 0 16px; color: var(--gris); font-size: 12.5px; }
.lead strong { color: var(--nuit); font-weight: 700; }

/* ---------- Choix du mode ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--nuit); border-radius: var(--rayon); overflow: hidden; }
.seg button {
  border: 0; background: var(--blanc); padding: 9px 6px; font-weight: 700; font-size: 11.5px;
  letter-spacing: .05em; text-transform: uppercase;
}
.seg button + button { border-left: 1.5px solid var(--nuit); }
.seg button[aria-pressed="true"] { background: var(--nuit); color: var(--blanc); }
.seg button:not([aria-pressed="true"]):hover { background: var(--voile); }

.panel { margin-top: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.field-label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.num, .text {
  border: 1.5px solid var(--gris-clair); border-radius: var(--rayon); padding: 7px 9px; background: var(--blanc);
  font-weight: 600; min-width: 0;
}
.num { width: 64px; text-align: center; }
.text { width: 100%; }
.num:focus, .text:focus { border-color: var(--nuit); outline: none; }

.list-head {
  display: flex; justify-content: space-between; align-items: center; margin-top: 12px;
  background: var(--nuit); color: var(--blanc); padding: 8px 12px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .09em; text-transform: uppercase; border-radius: var(--rayon) var(--rayon) 0 0;
}
.list-head .count { color: var(--turquoise); font-variant-numeric: tabular-nums; }
.list { border: 1px solid var(--gris-clair); border-top: 0; max-height: 228px; overflow-y: auto; }
.list label {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--gris-clair);
  cursor: pointer; font-weight: 600;
}
.list label:last-child { border-bottom: 0; }
.list label:hover { background: var(--voile); }
.list label.on { background: rgba(97, 227, 227, .16); }
.list .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .name.vide { font-style: italic; font-weight: 500; color: var(--gris); }
.list .col { font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--gris); flex: none; }
.list .empty { padding: 16px 12px; color: var(--gris); font-size: 12px; }
input[type="checkbox"], input[type="radio"] {
  appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; flex: none;
  border: 1.5px solid var(--nuit); background: var(--blanc); border-radius: 2px; display: grid; place-content: center;
}
input[type="radio"] { border-radius: 50%; }
input[type="checkbox"]:checked { background: var(--nuit); }
input[type="checkbox"]:checked::after {
  content: ""; width: 8px; height: 4px; border-left: 2px solid var(--turquoise); border-bottom: 2px solid var(--turquoise);
  transform: translateY(-1px) rotate(-45deg);
}
input[type="radio"]:checked::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--nuit); }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.mini button {
  border: 1px solid var(--gris-clair); background: var(--blanc); padding: 7px 4px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; border-radius: var(--rayon);
}
.mini button:hover { border-color: var(--nuit); }

.selbox { border: 1.5px dashed var(--nuit); border-radius: var(--rayon); padding: 12px 14px; background: var(--fond); }
.selbox .addr { font-size: 17px; font-weight: 800; letter-spacing: .01em; word-break: break-all; font-variant-numeric: tabular-nums; }
.selbox .meta { color: var(--gris); font-size: 11.5px; font-weight: 500; margin-top: 2px; }
.hint { color: var(--gris); font-size: 11.5px; margin: 8px 0 0; }
.hint b { color: var(--nuit); font-weight: 700; }
.stack { display: grid; gap: 6px; margin-top: 12px; }
.check { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-weight: 600; cursor: pointer; }
.note {
  margin-top: 12px; padding: 9px 12px; border-left: 3px solid var(--turquoise); background: var(--fond);
  font-size: 11.5px; color: var(--gris);
}
.note b { color: var(--nuit); }

/* ---------- Boutons ---------- */
.cta {
  width: 100%; margin-top: 16px; border: 0; border-radius: var(--rayon); background: var(--nuit); color: var(--blanc);
  min-height: 46px; padding: 10px 14px; font-weight: 700; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.cta svg { color: var(--turquoise); flex: none; }
.cta:hover:not(:disabled) { background: var(--nuit-2); }
.cta:disabled { background: var(--gris-clair); color: var(--gris); }
.cta:disabled svg { color: var(--gris); }
.btn {
  width: 100%; border: 1.5px solid var(--nuit); border-radius: var(--rayon); background: var(--blanc);
  min-height: 42px; padding: 8px 12px; font-weight: 700; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 9px;
}
.btn:hover:not(:disabled) { background: var(--voile); }
.btn:disabled { border-color: var(--gris-clair); color: #8d8d8d; }
.link { border: 0; background: none; padding: 6px 0; font-weight: 600; color: var(--gris); text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--nuit); }
.busy .cta, .busy .btn { opacity: .55; pointer-events: none; }

.section-title {
  margin: 24px 0 10px; padding-top: 16px; border-top: 1px solid var(--gris-clair);
  font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--gris);
}
.actions { display: grid; gap: 8px; }
.why { font-size: 11px; color: var(--gris); margin: -2px 0 4px; }

/* ---------- Rapport ---------- */
.report { border: 1px solid var(--nuit); border-radius: var(--rayon); overflow: hidden; }
.report-head {
  background: var(--nuit); color: var(--blanc); padding: 9px 14px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .09em; text-transform: uppercase; display: flex; align-items: center; gap: 9px;
}
.report-head svg { color: var(--turquoise); }
.kpi { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-bottom: 1px solid var(--gris-clair); }
.kpi .n { font-size: 28px; font-weight: 800; line-height: 1; min-width: 62px; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); }
.kpi .l small { display: block; text-transform: none; letter-spacing: 0; font-size: 11px; font-weight: 500; }
.report-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: var(--fond); font-size: 11px; color: var(--gris); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--nuit); letter-spacing: .06em; text-transform: uppercase; font-size: 10.5px; }
.badge i { width: 16px; height: 16px; border-radius: 50%; background: var(--turquoise); display: grid; place-content: center; }
.result { margin: 14px 0 0; font-size: 12.5px; }
.result b { font-weight: 700; }
.warn {
  margin-top: 12px; background: var(--nuit); color: var(--blanc); border-radius: var(--rayon);
  padding: 11px 13px; display: flex; gap: 10px; font-size: 11.5px; font-weight: 500;
}
.warn svg { color: var(--turquoise); flex: none; margin-top: 1px; }
.warn b { font-weight: 700; }
.error {
  margin: 0 0 14px; padding: 10px 12px; border: 1.5px solid var(--nuit); border-left-width: 5px; border-radius: var(--rayon);
  font-size: 12px; font-weight: 600;
}
.choice { display: flex; gap: 11px; align-items: flex-start; padding: 12px 13px; border: 1.5px solid var(--gris-clair); border-radius: var(--rayon); cursor: pointer; }
.choice.on { border-color: var(--nuit); background: var(--fond); }
.choice input { margin-top: 2px; }
.choice .t { font-weight: 700; }
.choice .d { color: var(--gris); font-size: 11.5px; }
.choice.off { opacity: .5; cursor: not-allowed; }
h2.view-title { margin: 0 0 6px; font-size: 16px; font-weight: 700; }

.foot { flex: none; padding: 12px 20px 14px; border-top: 1px solid var(--gris-clair); font-size: 10.5px; color: var(--gris); display: flex; justify-content: space-between; gap: 10px; }
.foot b { color: var(--nuit); font-weight: 700; }

/* ---------- Mode démonstration (hors Excel) ---------- */
body.demo { background: #DADAE3; }
.demo-wrap { display: none; }
body.demo .stage { display: grid; grid-template-columns: minmax(0, 1fr) 350px; height: 100vh; }
body.demo .demo-wrap { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--blanc); }
body.demo .pane { min-height: 0; height: 100vh; overflow-y: auto; box-shadow: -6px 0 22px rgba(22, 20, 73, .16); }
.demo-bar { background: var(--fond); border-bottom: 1px solid var(--gris-clair); padding: 9px 14px; font-size: 11.5px; color: var(--gris); }
.demo-bar b { color: var(--nuit); }
.demo-grid { flex: 1; overflow: auto; min-height: 0; }
.demo-grid table { border-collapse: collapse; font-family: Calibri, Arial, sans-serif; font-size: 12.5px; }
.demo-grid th { position: sticky; top: 0; background: #EFEFF3; color: var(--gris); font-weight: 400; border: 1px solid #D4D4DC; padding: 3px 8px; min-width: 34px; text-align: center; cursor: pointer; z-index: 1; user-select: none; }
.demo-grid th.rh { left: 0; z-index: 2; position: sticky; }
.demo-grid tbody th { top: auto; }
.demo-grid td { border: 1px solid #E3E3EA; padding: 3px 8px; white-space: nowrap; min-width: 84px; height: 22px; cursor: cell; user-select: none; }
.demo-grid td.dn { text-align: right; }
.demo-grid td.hd { font-weight: 700; }
.demo-grid td.sel { background: rgba(97, 227, 227, .28); box-shadow: inset 0 0 0 1px var(--nuit); }
.demo-tabs { display: flex; gap: 2px; padding: 0 10px; background: #EFEFF3; border-top: 1px solid #D4D4DC; overflow-x: auto; flex: none; }
.demo-tabs button { border: 0; background: none; padding: 7px 13px; font-size: 11.5px; font-weight: 600; color: var(--gris); border-bottom: 3px solid transparent; white-space: nowrap; }
.demo-tabs button.on { color: var(--nuit); background: var(--blanc); border-bottom-color: var(--turquoise); }
@media (max-width: 820px) {
  body.demo .stage { grid-template-columns: 1fr; grid-template-rows: 42vh auto; height: auto; }
  body.demo .pane { height: auto; box-shadow: 0 -6px 22px rgba(22, 20, 73, .16); }
}
@media (prefers-reduced-motion: no-preference) {
  .cta, .btn, .seg button, .list label { transition: background-color .15s ease, border-color .15s ease; }
}

</style>

      var areas = anonymiseAreas();
      if (!areas.length) throw new Error('Aucune plage à traiter dans cet onglet.');
      var data = await adapter.read(info.sheet, areas);
      data.forEach(function (d, i) { d.label = areas[i].label; });

      if (t.dataset.col !== undefined) { S.checked[t.dataset.col] = t.checked; render(); }
      else if (t.id === 'incNum') { S.includeNumbers = t.checked; }
      else if (t.name === 'scope') { S.restoreScope = t.value; render(); }
      else if (t.id === 'headerRow') {
        var v = parseInt(t.value, 10);
        S.headerRow = v >= 1 ? v : 1;
        S.checked = {};
        refresh();
      }
    });
    body.addEventListener('input', function (ev) {
      if (ev.target.id === 'aliasLabel') { S.label = ev.target.value; S.labelEdited = true; render(); }
    });
  }
  function start(a) {
    adapter = a;
    $('version').textContent = 'v' + VERSION;
    bindUi();
    if (adapter.demo) { document.body.classList.add('demo'); adapter.start(); }
    adapter.onChange(function () { scheduleRefresh(); });
    refresh();
  }
  function boot() {
    if (typeof Office === 'undefined' || !Office.onReady) return start(makeDemoAdapter());
    Office.onReady(function (info) {
      if (info && info.host === Office.HostType.Excel) start(ExcelAdapter);
      else start(makeDemoAdapter());
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
